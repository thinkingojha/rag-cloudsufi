[project]
name = "document-qa-service"
version = "0.1.0"
description = "A small, service-oriented RAG application for PDF question answering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "openai>=1.40,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "pypdf>=4.3,<6.0",
  "prometheus-client>=0.21,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "qdrant-client>=1.12,<2.0",
  "streamlit>=1.38,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI's Depends/File dependency declarations are intentional defaults.
